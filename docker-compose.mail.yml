version: "3.7"

# Separate project: ./scripts/mail uses -p pea3nut-mail so website refreshes
# cannot stop the SMTP listener or remove its containers.
services:
    mail-forwarder:
        build:
            context: ./mail
        env_file:
            - ./mail/mail.env
        ports:
            - "25:25"
        volumes:
            - ./mail/config:/etc/mail-forwarder:ro
            - ./mail/queue:/var/spool/postfix
            - ./mail/state:/var/lib/mail-forwarder
            # Mount the tree, not individual live/ symlinks, for Certbot renewals.
            - /etc/letsencrypt:/etc/letsencrypt:ro
        init: true
        restart: unless-stopped
        stop_grace_period: 30s
        healthcheck:
            test: ["CMD", "python3", "/opt/mail-forwarder/runtime.py", "healthcheck"]
            interval: 30s
            timeout: 10s
            start_period: 20s
            retries: 3
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
