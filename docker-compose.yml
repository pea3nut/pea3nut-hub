version: "3.7"
services:
    blog:
        container_name: pea3nut-blog
        build:
            context: ./blog
            dockerfile: Dockerfile
            args:
                db_name: "pea"
                root_url: "https://pea3nut.blog"
        ports:
            - "8081:80"
        volumes:
            - ./blog/mysql-data:/var/lib/mysql
            - ./blog/wordpress:/app
        restart: on-failure
    info:
        container_name: pea3nut-info
        image: pea3nut/pea3nut-info:latest
        ports:
            - "8082:80"
        restart: on-failure
    short-night:
        container_name: short-night-homepage
        image: pea3nut/short-night-homepage:latest
        ports:
            - "8083:80"
        restart: on-failure
    aoning_wordpress:
        image: wordpress:latest
        restart: unless-stopped
        ports:
            - "8085:80"
        environment:
            WORDPRESS_DB_HOST: aoning_db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress123
            WORDPRESS_DB_NAME: wordpress_data
        volumes:
            - ./aoning-wang/wordpress:/var/www/html

    aoning_db:
        image: mysql:8.0
        restart: on-failure:5
        init: true
        command:
            - --innodb-buffer-pool-size=128M
        container_name: aoning_db
        environment:
            MYSQL_DATABASE: wordpress_data
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress123
            MYSQL_ALLOW_EMPTY_PASSWORD: '1'
        volumes:
            - ./aoning-wang/mysql-data:/var/lib/mysql
    pxer:
        container_name: pxer
        image: pea3nut/pxer:master
        ports:
            - "8086:80"
        restart: on-failure
    pxer-homepage:
        container_name: pxer-homepage
        image: pea3nut/pxer-homepage:latest
        ports:
            - "8087:80"
        restart: on-failure
    pxer-homepage-2:
        container_name: pxer-homepage-2
        image: pea3nut/pxer-homepage-2:latest
        ports:
            - "8088:80"
        restart: on-failure
    point-hub:
        container_name: point-hub
        image: pea3nut/point-hub:master
        ports:
            - "8089:3000"
            - "8090:80"
        volumes:
            - ./points-data:/var/lib/mysql
        restart: on-failure
    gpt:
        container_name: gpt
        image: pea3nut/chat-gpt:latest
        ports:
            - "8091:3000"
        restart: on-failure
    gpt-2:
        container_name: gpt-2
        image: yidadaa/chatgpt-next-web
        ports:
            - "8092:3000"
        restart: on-failure
        environment:
            MYSQL_DATABASE: wordpress_data
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            CODE: ${GPT_2_PASSWORD}
            ENABLE_BALANCE_QUERY: 1
            HIDE_USER_API_KEY: 1
            DEFAULT_MODEL: 'gpt-4o'
            BASE_URL: 'https://openai-api.shab.fun'
    mail-forwarder:
        container_name: pea3nut-mail
        image: mailserver/docker-mailserver:17.0.0
        hostname: mail.pea3nut.org
        ports:
            - "25:25"
        environment:
            SMTP_ONLY: '1'
            ENABLE_SRS: '1'
            SRS_DOMAINNAME: srs.pea3nut.org
            SRS_SENDER_CLASSES: envelope_sender
            PERMIT_DOCKER: none
            POSTFIX_INET_PROTOCOLS: ipv4
            POSTMASTER_ADDRESS: postmaster@pea3nut.org
            SSL_TYPE: letsencrypt
            ENABLE_AMAVIS: '0'
            ENABLE_CLAMAV: '0'
            ENABLE_SPAMASSASSIN: '0'
            ENABLE_OPENDKIM: '0'
            ENABLE_OPENDMARC: '0'
            ENABLE_POLICYD_SPF: '0'
            ENABLE_RSPAMD: '0'
            ENABLE_FAIL2BAN: '0'
            ENABLE_DNSBL: '0'
        volumes:
            - ./mail/config:/tmp/docker-mailserver
            - ./mail/state:/var/mail-state
            - ./mail/logs:/var/log/mail
            - /etc/letsencrypt:/etc/letsencrypt:ro
        restart: unless-stopped
        stop_grace_period: 1m
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
